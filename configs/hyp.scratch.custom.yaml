# Hyperparameters for Exp 4 Ablation Study (Custom Fine-Tuning)
# Optimized for small custom traffic dataset (Taiwan street scenes)

lr0: 0.005  # initial learning rate (reduced for smoother convergence on small dataset)
lrf: 0.01   # final OneCycleLR learning rate (lr0 * lrf)
momentum: 0.937  # SGD momentum
weight_decay: 0.0005  # optimizer weight decay
warmup_epochs: 3.0  # warmup epochs
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr
box: 0.05  # box loss gain
cls: 0.5  # cls loss gain
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 1.0  # obj loss gain
obj_pw: 1.0  # obj BCELoss positive_weight
iou_t: 0.20  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold
fl_gamma: 0.0  # focal loss gamma
hsv_h: 0.015  # image HSV-Hue augmentation
hsv_s: 0.7  # image HSV-Saturation augmentation
hsv_v: 0.4  # image HSV-Value augmentation
degrees: 5.0  # image rotation (+/- deg) - slight rotation for dashcam angles
translate: 0.15  # image translation (+/- fraction)
scale: 0.5  # image scale (+/- gain)
shear: 2.0  # image shear (+/- deg)
perspective: 0.0005  # slight perspective change
flipud: 0.0  # no vertical flipping (cars are not upside down)
fliplr: 0.5  # horizontal flip
mosaic: 1.0  # mosaic augmentation
mixup: 0.1  # increased mixup for occlusion robustness
copy_paste: 0.0
paste_in: 0.05
loss_ota: 1
